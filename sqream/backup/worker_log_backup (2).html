<script>
    "use strict";
    var workerLogVars={baseUrl:"/api/aisqreamboard/worker_log",grid:$("#workerLogGrid")};
    $(function(){
     var end=new Date(),start=new Date(); start.setHours(start.getHours()-1);
     util.datetimePicker($("#workerLogSearchStart"),start); util.datetimePicker($("#workerLogSearchEnd"),end);
     initWorkerLogGrid(); searchWorkerLog();
    });
    function initWorkerLogGrid(){
     util.jqGrid(workerLogVars.grid,{datatype:"local",rownumbers:true,rownumWidth:32,
     // ===== 20260901 수정 시작 : MetricsProcess와 동일한 메인 Grid 폭 설정 =====
     shrinkToFit:true,autowidth:true,
     // ===== 20260901 수정 끝 : MetricsProcess와 동일한 메인 Grid 폭 설정 =====
     // ===== 20260902 수정 시작 : Worker Log 메인 조회 컬럼 순서/표시 형식 변경 =====
     colNames:["Global UUID","Hostname","Host IP","Query Start Time","Query End Time","Query Execution Time(sec)","SQL Statement","Query Plan","Database Name","Service Name","User ID","Connection ID","Statement ID"],
     colModel:[
     {name:"globalUuid",width:230,align:"center",formatter:function(v,opt,row){if(!v)return "";return '<a class="global-uuid-link" onclick="viewWorkerLogDetail(\''+String(row.id).replace(/\'/g,"\'")+'\',\''+String(v).replace(/\'/g,"\'")+'\')">'+$.jgrid.htmlEncode(v)+"</a>";}},
     {name:"hostname",width:145,align:"center"},
     {name:"hostip",width:130,align:"center"},
     {name:"queryStartTime",width:155,align:"center",formatter:formatSqDateTime},
     {name:"queryEndTime",width:155,align:"center",formatter:formatSqDateTime},
     {name:"queryExecutionTimeMs",width:170,align:"center",formatter:formatSqExecutionSecondsOneDecimal},
     {name:"sqlStatement",width:320,align:"center"},
     {name:"queryPlan",width:320,align:"center"},
     {name:"databaseName",width:140,align:"center"},
     {name:"serviceName",width:140,align:"center"},
     {name:"userId",width:120,align:"center"},
     {name:"connectionId",width:130,align:"center",formatter:formatSqRawInteger},
     {name:"statementId",width:130,align:"center",formatter:formatSqRawInteger}
     ],
     // ===== 20260902 수정 끝 : Worker Log 메인 조회 컬럼 순서/표시 형식 변경 =====
     rowNum:20,rowList:[20,50,100,200],pager:"#workerLogPager"});
    }
    function searchWorkerLog(){
     var url=workerLogVars.baseUrl+"?page=0&size=200";
     var start=normalizeDate($("#workerLogSearchStart").val()),end=normalizeDate($("#workerLogSearchEnd").val()),keyword=$("#workerLogSearchKeyword").val();
     if(start) url+="&startTime="+encodeURIComponent(start); if(end) url+="&endTime="+encodeURIComponent(end); if(keyword) url+="&keyword="+encodeURIComponent(keyword);
     $.get(url,function(data){
      workerLogVars.grid.clearGridData();
      workerLogVars.grid.setGridParam({data:data.content||[],datatype:"local"}).trigger("reloadGrid");
      // ===== 20260901 추가 시작 : MetricsProcess와 동일하게 조회 후 Grid 폭 재조정 =====
      centerWorkerLogGrid();
      // ===== 20260901 추가 끝 : MetricsProcess와 동일하게 조회 후 Grid 폭 재조정 =====
     })
     .fail(function(){alert("SQream Worker Log 조회에 실패했습니다.");});
    }

    // ===== 20260902 수정 시작 : Worker Log 메인 Grid 전체 가용 폭 사용 =====
    function centerWorkerLogGrid(){
     var $wrap=$(".worker-log-grid-shell");
     var width=$wrap.width();
     if(width && workerLogVars.grid[0] && workerLogVars.grid[0].grid){
      workerLogVars.grid.jqGrid("setGridWidth",width,true);
     }
    }
    // ===== 20260902 수정 끝 : Worker Log 메인 Grid 전체 가용 폭 사용 =====

    // ===== 20260902 수정 시작 : Worker Log 분석 팝업 오픈 + 종료쿼리 데이터 조회 =====
    function openWorkerLogChart(){
     $("#workerLogEndQueriesModal").addClass("on");
     $("body").css("overflow","hidden");
     if(typeof loadWorkerEndQueries === "function"){ loadWorkerEndQueries(); }
    }
    function closeWorkerLogChart(){
     $("#workerLogEndQueriesModal").removeClass("on");
     $("body").css("overflow","auto");
    }
    // ===== 20260902 수정 끝 : Worker Log 분석 팝업 오픈 + 종료쿼리 데이터 조회 =====

    function viewWorkerLogDetail(id,globalUuid){
     $.get(workerLogVars.baseUrl+"/"+encodeURIComponent(id),function(row){
      $("#workerLogDetailSummary").text("Global UUID: "+(globalUuid||row.globalUuid||"-"));
      renderWorkerLogDetail(row||{});$("#workerLogDetailModal").addClass("on");$("body").css("overflow","hidden");
     }).fail(function(){alert("상세 조회에 실패했습니다.");});
    }
    function renderWorkerLogDetail(row){
     var html='<div class="sqream-detail-record"><table class="sqream-detail-table"><colgroup><col class="detail-label-col"><col></colgroup><tbody>';
     html+=sqDetailRow("Server ID",row.serverId);
     html+=sqDetailRow("Hostname",row.hostname);
     html+=sqDetailRow("Host IP",row.hostip);
     html+=sqDetailRow("수집시간",formatSqDateTime(row.collectTime));
     html+=sqDetailRow("Row ID",row.rowId);
     html+=sqDetailRow("Timestamp",formatSqDateTime(row.timestamp));
     html+=sqDetailRow("Information Level",row.informationLevel);
     html+=sqDetailRow("Thread ID",row.threadId);
     html+=sqDetailRow("Worker Hostname",row.workerHostname);
     // ===== 20260902 수정 시작 : Worker Port 천단위 콤마 제거 =====
      html+=sqDetailRow("Worker Port",formatSqRawInteger(row.workerPort));
      // ===== 20260902 수정 끝 : Worker Port 천단위 콤마 제거 =====
     // ===== 20260902 수정 시작 : Connection ID 천단위 콤마 제거 =====
      html+=sqDetailRow("Connection ID",formatSqRawInteger(row.connectionId));
      // ===== 20260902 수정 끝 : Connection ID 천단위 콤마 제거 =====
     html+=sqDetailRow("Database Name",row.databaseName);
     html+=sqDetailRow("User ID",row.userId);
     // ===== 20260902 수정 시작 : Statement ID 천단위 콤마 제거 =====
      html+=sqDetailRow("Statement ID",formatSqRawInteger(row.statementId));
      // ===== 20260902 수정 끝 : Statement ID 천단위 콤마 제거 =====
     html+=sqDetailRow("Service Name",row.serviceName);
     html+=sqDetailRow("Message Type ID",row.messageTypeId);
     html+=sqDetailRow("Message Type",row.messageType);
     html+=sqDetailRow("Message",row.message);
     html+=sqDetailRow("Query Start Time",formatSqDateTime(row.queryStartTime));
     html+=sqDetailRow("Query End Time",formatSqDateTime(row.queryEndTime));
     html+=sqDetailRow("Query Execution Time(ms)",formatSqMs(row.queryExecutionTimeMs));
     html+=sqDetailRow("Termination Status",row.queryTerminationStatus);
     html+=sqDetailRow("Termination Message",row.queryTerminationMessage);
     html+=sqDetailRow("Total Data Read(MB)",formatSqNumber(row.totalDataReadMb));
     html+=sqDetailRow("Total Processed Rows",formatSqNumber(row.totalProcessedRows));
     html+=sqDetailRow("Result Row Count",formatSqNumber(row.resultRowCount));
     html+=sqDetailRow("SQL Statement",row.sqlStatement);
     html+=sqDetailRow("SQL Type",row.sqlType);
     html+=sqDetailRow("Log File Path",row.logFilePath);
     html+=sqDetailRow("Error Details",row.errorDetails);
     html+=sqDetailRow("Query Plan",row.queryPlan);
     html+=sqDetailRow("Lock Wait Time(ms)",formatSqMs(row.lockWaitTimeMs));
     html+=sqDetailRow("Network Transmit",formatSqBytesGB(row.networkTransmitBytes));
     html+=sqDetailRow("Log Key",row.logKey);
     html+=sqDetailRow("Terminated",formatSqBool(row.terminated));
     html+=sqDetailRow("Create DT",formatSqDateTime(row.createDt));
     html+=sqDetailRow("Update DT",formatSqDateTime(row.updateDt));
     html+='</tbody></table></div>'; $("#workerLogDetailBody").html(html);
    }
    function closeWorkerLogDetail(){ $("#workerLogDetailModal").removeClass("on");$("body").css("overflow","auto"); }
    function sqDetailRow(label,value){var v=(value===null||value===undefined||value==="")?"-":String(value);return '<tr><th>'+$.jgrid.htmlEncode(label)+'</th><td><div class="sqream-detail-value-box">'+$.jgrid.htmlEncode(v)+'</div></td></tr>';}
    function formatSqDateTime(v) {
      if (!v) return "";
      var value = String(v).replace("T", " ");
      return value.substring(0, 19);
    }
    function formatSqSeconds(v){if(v===null||v===undefined||v==="")return "";var n=Number(v);if(isNaN(n))return v;var d=Math.floor(n/86400);n-=d*86400;var h=Math.floor(n/3600);n-=h*3600;var m=Math.floor(n/60);n-=m*60;var s=Math.round(n*1000)/1000;var a=[];if(d)a.push(d+"일");if(h||d)a.push(h+"시간");if(m||h||d)a.push(m+"분");a.push(s+"초");return a.join(" ");}
    function formatSqBytesGB(v){if(v===null||v===undefined||v==="")return "";var n=Number(v);if(isNaN(n))return v;return (n/1024/1024/1024).toFixed(2)+" GB";}
    function formatSqMsAsSeconds(v){if(v===null||v===undefined||v==="")return "";var n=Number(v);if(isNaN(n))return v;return formatSqSeconds(n/1000);}
    // ===== 20260902 추가 시작 : Query Execution Time 초 단위 소수점 한자리 =====
    function formatSqExecutionSecondsOneDecimal(v){
      if(v===null||v===undefined||v==="")return "";
      var n=Number(v);
      if(isNaN(n))return v;
      return (n/1000).toFixed(1);
    }
    // ===== 20260902 추가 끝 : Query Execution Time 초 단위 소수점 한자리 =====
    function formatSqMs(v){if(v===null||v===undefined||v==="")return "";var n=Number(v);return isNaN(n)?v:n.toLocaleString()+" ms";}
    function formatSqRawInteger(v){if(v===null||v===undefined||v==="")return "";return String(v);}
    function formatSqNumber(v){if(v===null||v===undefined||v==="")return "";var n=Number(v);return isNaN(n)?v:n.toLocaleString();}
    function formatSqBool(v){if(v===true)return "Y";if(v===false)return "N";return "";}
    function normalizeDate(v){if(!v)return "";return String(v).trim().replace("T"," ");}
</script>
