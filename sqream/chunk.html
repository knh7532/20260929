<div class="container"><div class="content trace">

<script>
    "use strict";
    var chunkVars={baseUrl:"/api/aisqreamboard/chunk",grid:$("#chunkGrid")};
    $(function(){
     var end=new Date(),start=new Date(); start.setHours(start.getHours()-1);
     util.datetimePicker($("#chunkSearchStart"),start); util.datetimePicker($("#chunkSearchEnd"),end);
     initChunkGrid(); searchChunk();
    });
    function initChunkGrid(){
     util.jqGrid(chunkVars.grid,{datatype:"local",rownumbers:true,rownumWidth:32,
     // ===== 20260901 수정 시작 : MetricsProcess와 동일한 메인 Grid 폭 설정 =====
     shrinkToFit:true,autowidth:true,
     // ===== 20260901 수정 끝 : MetricsProcess와 동일한 메인 Grid 폭 설정 =====
     // ===== 20260902 수정 시작 : Chunk 메인 조회 컬럼 순서/Global UUID 폭/Compression Ratio 변경 =====
     colNames:["Global UUID","Table ID","Database Name","Schema Name","Table Name","Column Count","Total Rows","Total Chunks","No Deletion","Some Deletion","All Deletion","Compressed Size","Uncompressed Size","Compression Ratio"],
     colModel:[
     {name:"globalUuid",width:165,align:"center",formatter:function(v,opt,row){if(!v)return "";return '<a class="global-uuid-link" onclick="viewChunkDetail(\''+String(row.id).replace(/\'/g,"\'")+'\',\''+String(v).replace(/\'/g,"\'")+'\')">'+$.jgrid.htmlEncode(v)+"</a>";}},
     {name:"tableId",width:100,align:"center",formatter:formatSqRawInteger},
     {name:"databaseName",width:135,align:"center"},
     {name:"schemaName",width:125,align:"center"},
     {name:"tableName",width:145,align:"center"},
     {name:"columnCount",width:110,align:"center",formatter:formatSqNumber},
     {name:"totalRows",width:120,align:"center",formatter:formatSqNumber},
     {name:"totalChunks",width:110,align:"center",formatter:formatSqNumber},
     {name:"noDeletionCnt",width:110,align:"center",formatter:formatSqNumber},
     {name:"someDeletionCnt",width:115,align:"center",formatter:formatSqNumber},
     {name:"allDeletionCnt",width:110,align:"center",formatter:formatSqNumber},
     {name:"compressedTableSizeByte",width:135,align:"center",formatter:formatSqBytesGB},
     {name:"uncompressedTableSizeByte",width:145,align:"center",formatter:formatSqBytesGB},
     {name:"compressionRatio",width:125,align:"center",formatter:formatSqOneDecimal}
     ],
     // ===== 20260902 수정 끝 : Chunk 메인 조회 컬럼 순서/Global UUID 폭/Compression Ratio 변경 =====
     rowNum:20,rowList:[20,50,100,200],pager:"#chunkPager"});
    }
    function searchChunk(){
     var url=chunkVars.baseUrl+"?page=0&size=200";
     var start=normalizeDate($("#chunkSearchStart").val());
     var end=normalizeDate($("#chunkSearchEnd").val());
     if(start) url+="&startTime="+encodeURIComponent(start);
     if(end) url+="&endTime="+encodeURIComponent(end);

     // ===== 20260907 추가 시작 : Chunk 검색 파라미터 =====
     var params={
      hostname:$("#chunkHostname").val(),
      databaseName:$("#chunkDatabaseName").val(),
      schemaName:$("#chunkSchemaName").val(),
      tableName:$("#chunkTableName").val(),
      totalChunks:$("#chunkTotalChunks").val(),
      totalRows:$("#chunkTotalRows").val(),
      noDeletionCnt:$("#chunkNoDeletionCnt").val(),
      someDeletionCnt:$("#chunkSomeDeletionCnt").val()
     };
     $.each(params,function(k,v){
      if(v!==undefined&&v!==null&&String(v).trim()!==""){
       url+="&"+encodeURIComponent(k)+"="+encodeURIComponent(String(v).trim());
      }
     });
     // ===== 20260907 추가 끝 : Chunk 검색 파라미터 =====

     $.get(url,function(data){
      chunkVars.grid.clearGridData();
      chunkVars.grid.setGridParam({data:data.content||[],datatype:"local"}).trigger("reloadGrid");
      centerChunkGrid();
     }).fail(function(){alert("SQream Chunk 조회에 실패했습니다.");});
    }

    // ===== 20260901 추가 시작 : MetricsProcess와 동일한 메인 Grid 폭 조정 함수 =====
    function centerChunkGrid(){
     var $wrap=$(".chunk-grid-shell");
     var width=$wrap.width();
     if(width && chunkVars.grid[0] && chunkVars.grid[0].grid){
      chunkVars.grid.jqGrid("setGridWidth",width,true);
     }
    }
    // ===== 20260901 추가 끝 : MetricsProcess와 동일한 메인 Grid 폭 조정 함수 =====
    function viewChunkDetail(id,globalUuid){
     $.get(chunkVars.baseUrl+"/"+encodeURIComponent(id),function(row){
      $("#chunkDetailSummary").text("Global UUID: "+(globalUuid||row.globalUuid||"-"));
      renderChunkDetail(row||{});$("#chunkDetailModal").addClass("on");$("body").css("overflow","hidden");
     }).fail(function(){alert("상세 조회에 실패했습니다.");});
    }
    function renderChunkDetail(row){
     var html='<div class="sqream-detail-record"><table class="sqream-detail-table"><colgroup><col class="detail-label-col"><col></colgroup><tbody>';
     html+=sqDetailRow("Server ID",row.serverId);
     html+=sqDetailRow("수집시간",formatSqDateTime(row.collectTime));
     html+=sqDetailRow("Hostname",row.hostname);
     html+=sqDetailRow("Host IP",row.hostip);
     // ===== 20260902 수정 시작 : Table ID 천단위 콤마 제거 =====
      html+=sqDetailRow("Table ID",formatSqRawInteger(row.tableId));
      // ===== 20260902 수정 끝 : Table ID 천단위 콤마 제거 =====
     html+=sqDetailRow("Total Chunks",formatSqNumber(row.totalChunks));
     html+=sqDetailRow("Database Name",row.databaseName);
     html+=sqDetailRow("Schema Name",row.schemaName);
     html+=sqDetailRow("Table Name",row.tableName);
     html+=sqDetailRow("Column Count",formatSqNumber(row.columnCount));
     html+=sqDetailRow("Total Rows",formatSqNumber(row.totalRows));
     html+=sqDetailRow("90~100%",formatSqNumber(row.pct90100));
     html+=sqDetailRow("80~90%",formatSqNumber(row.pct8090));
     html+=sqDetailRow("70~80%",formatSqNumber(row.pct7080));
     html+=sqDetailRow("60~70%",formatSqNumber(row.pct6070));
     html+=sqDetailRow("50~60%",formatSqNumber(row.pct5060));
     html+=sqDetailRow("40~50%",formatSqNumber(row.pct4050));
     html+=sqDetailRow("30~40%",formatSqNumber(row.pct3040));
     html+=sqDetailRow("20~30%",formatSqNumber(row.pct2030));
     html+=sqDetailRow("10~20%",formatSqNumber(row.pct1020));
     html+=sqDetailRow("0~10%",formatSqNumber(row.pct010));
     html+=sqDetailRow("No Deletion",formatSqNumber(row.noDeletionCnt));
     html+=sqDetailRow("Some Deletion",formatSqNumber(row.someDeletionCnt));
     html+=sqDetailRow("All Deletion",formatSqNumber(row.allDeletionCnt));
     html+=sqDetailRow("Table Create Time",formatSqDateTime(row.tableCreateTime));
     html+=sqDetailRow("Check Time",formatSqDateTime(row.checkTime));
     html+=sqDetailRow("Compressed Table Size",formatSqBytesGB(row.compressedTableSizeByte));
     html+=sqDetailRow("Uncompressed Table Size",formatSqBytesGB(row.uncompressedTableSizeByte));
     html+=sqDetailRow("Savings Rate(%)",row.savingsRate);
     // ===== 20260902 수정 시작 : Compression Ratio 소수점 한자리 표시 =====
      html+=sqDetailRow("Compression Ratio",formatSqOneDecimal(row.compressionRatio));
      // ===== 20260902 수정 끝 : Compression Ratio 소수점 한자리 표시 =====
     html+=sqDetailRow("Create DT",formatSqDateTime(row.createDt));
     html+=sqDetailRow("Update DT",formatSqDateTime(row.updateDt));
     html+='</tbody></table></div>'; $("#chunkDetailBody").html(html);
    }
    function closeChunkDetail(){ $("#chunkDetailModal").removeClass("on");$("body").css("overflow","auto"); }
    function sqDetailRow(label,value){var v=(value===null||value===undefined||value==="")?"-":String(value);return '<tr><th>'+$.jgrid.htmlEncode(label)+'</th><td><div class="sqream-detail-value-box">'+$.jgrid.htmlEncode(v)+'</div></td></tr>';}
    function formatSqDateTime(v) {
      if (!v) return "";
      var value = String(v).replace("T", " ");
      return value.substring(0, 19);
    }
    function formatSqSeconds(v){if(v===null||v===undefined||v==="")return "";var n=Number(v);if(isNaN(n))return v;var d=Math.floor(n/86400);n-=d*86400;var h=Math.floor(n/3600);n-=h*3600;var m=Math.floor(n/60);n-=m*60;var s=Math.round(n*1000)/1000;var a=[];if(d)a.push(d+"일");if(h||d)a.push(h+"시간");if(m||h||d)a.push(m+"분");a.push(s+"초");return a.join(" ");}
    function formatSqBytesGB(v){if(v===null||v===undefined||v==="")return "";var n=Number(v);if(isNaN(n))return v;return (n/1024/1024/1024).toFixed(2)+" GB";}
    function formatSqMs(v){if(v===null||v===undefined||v==="")return "";var n=Number(v);return isNaN(n)?v:n.toLocaleString()+" ms";}
    function formatSqRawInteger(v){if(v===null||v===undefined||v==="")return "";return String(v);}
    // ===== 20260902 추가 시작 : Compression Ratio 소수점 한자리 Formatter =====
    function formatSqOneDecimal(v){
      if(v===null||v===undefined||v==="")return "";
      var n=Number(v);
      return isNaN(n)?v:n.toFixed(1);
    }
    // ===== 20260902 추가 끝 : Compression Ratio 소수점 한자리 Formatter =====
    function formatSqNumber(v){if(v===null||v===undefined||v==="")return "";var n=Number(v);return isNaN(n)?v:n.toLocaleString();}
    function formatSqBool(v){if(v===true)return "Y";if(v===false)return "N";return "";}
    function normalizeDate(v){if(!v)return "";return String(v).trim().replace("T"," ");}
</script>
