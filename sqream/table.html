<script>
"use strict";

// ===== 20260903 추가 시작 : Sqream Table jqGrid / 상세조회 =====
var sqreamTableVars={
    baseUrl:"/api/aisqreamboard/table",
    grid:$("#sqreamTableGrid")
};

$(function(){
    var end=new Date(),start=new Date();
    start.setHours(start.getHours()-1);
    util.datetimePicker($("#sqreamTableSearchStart"),start);
    util.datetimePicker($("#sqreamTableSearchEnd"),end);
    initSqreamTableGrid();
    searchSqreamTable();

    $(window).on("resize.sqreamTable",function(){
        centerSqreamTableGrid();
    });
});

function initSqreamTableGrid(){
    util.jqGrid(sqreamTableVars.grid,{
        datatype:"local",
        rownumbers:true,
        rownumWidth:32,
        shrinkToFit:true,
        autowidth:true,
        colNames:[
            "Global UUID","수집시간","Hostname","Host IP","Database",
            "Table ID","Schema","Table Name","Row Count Valid","Row Count",
            "Deleted Rows","Deleted Ratio(%)","Row Consistent","Needs Rechunk","Full Table Name"
        ],
        colModel:[
            {name:"globalUuid",width:210,align:"center",formatter:function(v){
                if(!v)return "";
                return '<a class="global-uuid-link" onclick="viewSqreamTableDetail(\''+
                    escapeSqJs(v)+'\')">'+$.jgrid.htmlEncode(v)+'</a>';
            }},
            {name:"collectTime",width:145,align:"center",formatter:formatSqDateTime},
            {name:"hostname",width:100,align:"center"},
            {name:"hostip",width:105,align:"center"},
            {name:"databaseName",width:100,align:"center"},
            {name:"tableId",width:85,align:"center",formatter:formatRawInteger},
            {name:"schemaName",width:95,align:"center"},
            {name:"tableName",width:115,align:"center"},
            {name:"rowCountValid",width:105,align:"center",formatter:formatPlainNumber},
            {name:"rowCount",width:105,align:"center",formatter:formatPlainNumber},
            {name:"deletedRowCount",width:100,align:"center",formatter:formatPlainNumber},
            {name:"deletedRowRatio",width:105,align:"center",formatter:formatPercent2},
            {name:"rowConsistent",width:105,align:"center",formatter:formatBoolean},
            {name:"needsRechunk",width:105,align:"center",formatter:formatBoolean},
            {name:"fullTableName",width:210,align:"left"}
        ],
        rowNum:20,
        rowList:[20,50,100,200],
        pager:"#sqreamTablePager"
    });
}

function searchSqreamTable(){
    var url=sqreamTableVars.baseUrl+"?page=0&size=200";
    var start=normalizeDate($("#sqreamTableSearchStart").val());
    var end=normalizeDate($("#sqreamTableSearchEnd").val());
    if(start)url+="&startTime="+encodeURIComponent(start);
    if(end)url+="&endTime="+encodeURIComponent(end);

    // ===== 20260907 추가 시작 : Sqream Table 검색 파라미터 =====
    var params={
        hostname:$("#sqreamTableHostname").val(),
        databaseName:$("#sqreamTableDatabaseName").val(),
        schemaName:$("#sqreamTableSchemaName").val(),
        tableName:$("#sqreamTableTableName").val(),
        rowCount:$("#sqreamTableRowCount").val(),
        deletedRowCount:$("#sqreamTableDeletedRowCount").val(),
        needsRechunk:$("#sqreamTableNeedsRechunk").val()
    };
    $.each(params,function(k,v){
        if(v!==undefined&&v!==null&&String(v).trim()!==""){
            url+="&"+encodeURIComponent(k)+"="+encodeURIComponent(String(v).trim());
        }
    });
    // ===== 20260907 추가 끝 : Sqream Table 검색 파라미터 =====

    $.get(url,function(data){
        sqreamTableVars.grid.clearGridData();
        sqreamTableVars.grid.setGridParam({
            data:data.content||[],
            datatype:"local"
        }).trigger("reloadGrid");
        centerSqreamTableGrid();
    });
}

function centerSqreamTableGrid(){
    var width=$("#sqreamTableGridShell").width();
    if(width)sqreamTableVars.grid.jqGrid("setGridWidth",width,true);
    $("#gbox_sqreamTableGrid").css({marginLeft:"auto",marginRight:"auto"});
}

function viewSqreamTableDetail(globalUuid){
    $("#selectedSqreamTableUuid").text("Global UUID : "+globalUuid);
    $("#sqreamTableDetailList").html('<div class="metrics-detail-empty">조회 중...</div>');
    $("#sqreamTableDetailModal").addClass("on");

    $.get(sqreamTableVars.baseUrl+"/"+encodeURIComponent(globalUuid),function(rows){
        renderSqreamTableDetail(rows||[]);
    }).fail(function(){
        $("#sqreamTableDetailList").html('<div class="metrics-detail-empty">상세조회에 실패했습니다.</div>');
    });
}

function renderSqreamTableDetail(rows){
    if(!rows.length){
        $("#sqreamTableDetailList").html('<div class="metrics-detail-empty">조회된 상세 데이터가 없습니다.</div>');
        return;
    }
    var html="";
    $.each(rows,function(i,r){
        html+='<div class="metrics-detail-record">'+
            '<div class="metrics-detail-record-title">'+
                '<span class="record-no">#'+(i+1)+'</span>'+
                '<span class="record-point">'+escapeHtml(r.fullTableName||r.tableName||"-")+'</span>'+
            '</div>'+
            '<table class="metrics-detail-table"><colgroup><col class="detail-label-col"><col></colgroup><tbody>'+
            detailRow("ID",r.id)+
            detailRow("Server ID",r.serverId)+
            detailRow("Collect Time",formatSqDateTime(r.collectTime))+
            detailRow("Hostname",r.hostname)+
            detailRow("Host IP",r.hostip)+
            detailRow("Global UUID",r.globalUuid)+
            detailRow("Database Name",r.databaseName)+
            detailRow("Table ID",raw(r.tableId))+
            detailRow("Schema Name",r.schemaName)+
            detailRow("Table Name",r.tableName)+
            detailRow("Row Count Valid",raw(r.rowCountValid))+
            detailRow("Row Count",raw(r.rowCount))+
            detailRow("Rechunker Ignore",raw(r.rechunkerIgnore))+
            detailRow("Deleted Row Count",raw(r.deletedRowCount))+
            detailRow("Deleted Row Ratio",r.deletedRowRatio==null?"-":Number(r.deletedRowRatio).toFixed(2)+" %")+
            detailRow("Is Row Consistent",boolText(r.rowConsistent))+
            detailRow("Needs Rechunk",boolText(r.needsRechunk))+
            detailRow("Comment",r.comment)+
            detailRow("Full Table Name",r.fullTableName)+
            detailRow("Create DT",formatSqDateTime(r.createDt))+
            detailRow("Update DT",formatSqDateTime(r.updateDt))+
            '</tbody></table></div>';
    });
    $("#sqreamTableDetailList").html(html);
}

function closeSqreamTableDetail(){$("#sqreamTableDetailModal").removeClass("on");}
function detailRow(label,value){return '<tr><th>'+escapeHtml(label)+'</th><td><div class="metrics-detail-value-box">'+escapeHtml(value==null||value===""?"-":value)+'</div></td></tr>';}
function formatSqDateTime(v){if(!v)return "";return String(v).replace("T"," ").substring(0,19);}
function formatRawInteger(v){return v==null||v===""?"":String(v);}
function raw(v){return v==null||v===""?"-":String(v);}
function formatPlainNumber(v){return v==null||v===""?"":String(v);}
function formatPercent2(v){if(v==null||v==="")return "";var n=Number(v);return isNaN(n)?v:n.toFixed(2)+" %";}
function formatBoolean(v){if(v===true)return "Y";if(v===false)return "N";return "";}
function boolText(v){if(v===true)return "true";if(v===false)return "false";return "-";}
function escapeHtml(v){return $.jgrid.htmlEncode(v==null?"":String(v));}
function escapeSqJs(v){return String(v==null?"":v).replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
// ===== 20260903 추가 끝 : Sqream Table jqGrid / 상세조회 =====
// ===== 20260903 추가 시작 : 조회기간 normalizeDate 함수 =====
function normalizeDate(value) {
    if (!value) {
        return "";
    }

    value = String(value).trim();

    // yyyy-MM-dd HH:mm:ss 형태면 그대로 사용
    if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(value)) {
        return value;
    }

    // yyyy-MM-dd HH:mm 형태면 초 추가
    if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(value)) {
        return value + ":00";
    }

    return value;
}
