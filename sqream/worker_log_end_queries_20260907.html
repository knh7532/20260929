         if(step.rows!=null)detail.push("Rows: "+formatSqNumber(step.rows));

         if(step.chunkPerRows!=null)detail.push("Chunk Per Rows: "+formatSqNumber(step.chunkPerRows));
         var runtime=(step.planRuntime==null||step.planRuntime==="")?"-":Number(step.planRuntime).toFixed(2)+"s";
         html+='<tr>'+
         '<td>'+escapeWorkerEnd(step.step==null?"-":step.step)+'</td>'+
         '<td>'+escapeWorkerEnd(step.planName||"-")+'</td>'+
         '<td class="sqm-dim">'+escapeWorkerEnd(detail.length?detail.join(" / "):"-")+'</td>'+
         '<td class="num">'+escapeWorkerEnd(runtime)+'</td>'+
         '<td><span class="sqm-pill">'+escapeWorkerEnd(step.status||"-")+'</span></td>'+
         '</tr>';
        });
        return html;
        }
        function setWorkerEndTab(tab){var sql=tab==="sql";$("#workerEndTabSql").attr("aria-selected",String(sql));$("#workerEndTabPlan").attr("aria-selected",String(!sql));$("#workerEndPaneSql").toggle(sql);$("#workerEndPanePlan").toggle(!sql);}
        function closeWorkerEndDetail(){$("#workerLogEndQueryDetailModal").removeClass("on");workerEndCurrent=null;}
        function copyWorkerEndSql(){if(!workerEndCurrent)return;var text=workerEndCurrent.sqlStatement||"";if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){alert("쿼리문을 복사했습니다.");},function(){alert("복사에 실패했습니다.");});}
        function escapeWorkerEnd(v){return $.jgrid.htmlEncode(v==null?"":String(v));}function escapeWorkerEndAttr(v){return escapeWorkerEnd(v).replace(/"/g,"&quot;");}
        $(document).on("keydown.workerEndQueries",function(e){if(e.keyCode!==27)return;if($("#workerLogEndQueryDetailModal").hasClass("on"))closeWorkerEndDetail();else if($("#workerLogEndQueriesModal").hasClass("on"))closeWorkerLogChart();});

    </script>
