<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종료 SQream DB 쿼리 Mockup</title>
<style>
/* 디자인 토큰 — sqream_running_queries_mockup.html과 동일(다크), body.light가 라이트 팔레트로 덮는다 */
:root{
  --bg:#0e1420; --panel:#141b2e; --panel-alt:#1a2338; --panel-sel:#1b2a47; --border:#232d45;
  --text:#ffffff; --text-2:#9098ac; --text-3:#5c6579;
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171; --accent:#22d3ee; --link:#5b9bff; --muted:#6b7280;
  --yellow:#fbbf24; --red:#f87171; --bg-deep:#0a0f1e; --card:#141b2e;
  --font:"Pretendard","Pretendard Variable",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  --font-mono:"JetBrains Mono","Consolas",monospace;
}
body.light{
  --bg:#f5f7fb; --panel:#ffffff; --panel-alt:#f1f5f9; --panel-sel:#e8eef7; --border:#dfe5ee;
  --text:#182238; --text-2:#6f7b90; --text-3:#8692a4;
  --ok:#178a4c; --warn:#b45309; --danger:#c2410c; --accent:#0e7490; --link:#3478e5; --muted:#6f7b90;
  --yellow:#b45309; --red:#dc2626; --bg-deep:#f8fafc; --card:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:11px}

/* 상태 띠 */
.strip{display:flex;align-items:center;gap:18px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--panel)}
.strip__title{font-size:16px;font-weight:700;margin-right:8px}
.strip__item{color:var(--text-2);font-size:11px}
.strip__item b{color:var(--text)}
.strip__dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:baseline}
.mode-btn{margin-left:auto;background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;font:inherit;font-size:12px;padding:4px 12px}
.mode-btn:hover{border-color:var(--accent);color:var(--accent)}

/* 패널·표 */
.wrap{padding:10px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:3px;overflow:hidden}
.panel__head{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--border)}
.panel__title{margin:0;font-size:12px;font-weight:600}
.panel__hint{margin-left:auto;color:var(--text-3);font-size:10px}
.table-scroll{overflow:auto;max-height:calc(100vh - 120px);scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.table-scroll::-webkit-scrollbar{width:8px;height:8px}
.table-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.data-table{border-collapse:collapse;font-size:11px;table-layout:fixed;width:1504px}
.data-table th,.data-table td{padding:3px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--border)}
.data-table th{color:var(--text-2);font-weight:500;font-size:10px;background:var(--panel-alt);text-align:center;cursor:pointer;user-select:none}
.data-table th:hover{color:var(--accent)}
.data-table th.is-sorted{color:var(--accent)}
.data-table td{color:var(--text)}
.data-table .num{text-align:right}
.data-table .mono{font-family:var(--font-mono);color:var(--text-2)}
.data-table tbody tr{cursor:pointer}
.data-table tbody tr:hover td{background:var(--panel-sel)}
.data-table tr.row--spool td{background:rgba(255,90,20,.24)}
.data-table tr.row--spool:hover td{background:rgba(255,90,20,.34)}
.data-table tr.row--long td{background:rgba(255,190,0,.22)}
.data-table tr.row--long:hover td{background:rgba(255,190,0,.32)}
body.light .data-table tr.row--spool td{background:rgba(255,90,20,.16)}
body.light .data-table tr.row--long td{background:rgba(255,190,0,.18)}

/* 게이지·배지 */
.gauge-cell{position:relative;display:inline-flex;align-items:center;justify-content:flex-end;width:72px;height:16px;border-radius:3px;background:var(--panel-alt);overflow:hidden;vertical-align:middle}
.gauge-cell__bar{position:absolute;left:0;top:0;bottom:0;background:var(--ok);opacity:.35}
.gauge-cell__text{position:relative;padding-right:6px;font-size:10px}
.gauge-pair{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px}
.gauge-pair__text{font-size:11px;color:var(--text)}
.state-badge{display:inline-block;padding:1px 8px;border-radius:3px;font-size:10px;font-weight:600}
.state--done{background:rgba(74,222,128,.16);color:var(--ok)}
body.light .state--done{background:rgba(23,138,76,.12)}
.svc-badge{display:inline-block;padding:1px 8px;border-radius:3px;font-size:10px;font-weight:600;background:rgba(250,222,42,.13);border:1px solid rgba(250,222,42,.4);color:#fade2a}
body.light .svc-badge{background:rgba(180,120,0,.08);border-color:rgba(180,120,0,.45);color:#8a5a00}
.svc-dim{color:#7e93b4}
.query-linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--link);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.query-linkbtn:hover{color:var(--text)}

/* ── Query 상세 모달 (running 목업과 동일 — 종료라 실행 중 단계 없음) ── */
.sqm-modal-backdrop{align-items:center;background:rgb(0 0 0 / 60%);display:none;inset:0;justify-content:center;position:fixed;z-index:60}
.sqm-modal-backdrop.show{display:flex}
.sqm-modal{background:var(--card);border:1px solid var(--border);border-radius:10px;max-width:820px;padding:20px 22px;width:min(820px,94vw)}
.sqm-modal h3{font-size:15px;margin:0 0 10px}
.sqm-modal h3 .id{color:var(--accent)}
.sqm-tabs{border-bottom:1px solid var(--border);display:flex;gap:2px;margin-bottom:12px}
.sqm-tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;padding:6px 12px}
.sqm-tab:hover{color:var(--text)}
.sqm-tab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--accent);font-weight:600}
.sqm-cmd__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sqm-dim{color:var(--muted);font-size:12px}
.sqm-btn{background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;font:inherit;font-size:13px;padding:5px 14px}
.sqm-btn:hover{border-color:var(--accent)}
.sqm-plan{background:var(--bg-deep);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-mono);font-size:12px;line-height:1.65;max-height:55vh;overflow:auto;padding:14px 16px;white-space:pre;margin:0}
.sqm-plansteps{background:var(--bg-deep);border:1px solid var(--border);border-radius:6px;max-height:55vh;overflow:auto;padding:6px 12px 10px}
.sqm-plansteps table{border-collapse:collapse;font-size:12px;width:100%}
.sqm-plansteps th{border-bottom:1px solid var(--border);color:var(--muted);font-weight:600;padding:6px 8px;text-align:left}
.sqm-plansteps td{border-bottom:1px solid rgb(34 56 92 / 45%);padding:5px 8px}
body.light .sqm-plansteps td{border-bottom-color:var(--border)}
.sqm-plansteps .num{font-variant-numeric:tabular-nums;text-align:right}
.sqm-plansteps__gpu{color:var(--accent);font-size:10px}
.sqm-plansteps__time--yellow{color:var(--yellow);font-weight:600}
.sqm-plansteps__time--red{color:var(--red);font-weight:700}
.sqm-plansteps__note{font-size:11px;margin:8px 0 0;color:var(--muted)}
.sqm-pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:600}
.sqm-pill--green{background:rgba(74,222,128,.16);color:var(--ok)}
body.light .sqm-pill--green{background:rgba(23,138,76,.12)}
.sqm-modal__actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:8px 14px;font-size:12px;display:none;z-index:70}
</style>
</head>
<body>

<div class="strip" role="status">
  <span class="strip__title">종료 SQream DB 쿼리</span>
  <span class="strip__item"><span class="strip__dot"></span>어댑터 <b>UP</b> (sim)</span>
  <span class="strip__item">문장 <b id="rowCount">-</b></span>
  <span class="strip__item">원천 스냅샷 <b id="snapAt">-</b> (0s 전)</span>
  <span class="strip__item">화면 갱신 <b id="clock">-</b></span>
  <button type="button" class="mode-btn" id="themeBtn">라이트 모드</button>
</div>

<div class="wrap">
  <div class="panel">
    <div class="panel__head">
      <h2 class="panel__title">종료 SQream DB 쿼리 (인스턴스: All)</h2>
      <span class="panel__hint">행 클릭: 쿼리문·실행 계획 · 헤더 클릭: 정렬(내림차순 우선, 결측 뒤)</span>
    </div>
    <div class="table-scroll">
      <table class="data-table" id="tbl">
        <colgroup id="cols"></colgroup>
        <thead><tr id="headRow"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Query 상세 모달 — 쿼리문·실행 계획 2탭 (종료 쿼리: 전 단계 완료) -->
<div class="sqm-modal-backdrop" id="modalBg" role="dialog" aria-modal="true">
  <div class="sqm-modal">
    <h3>📄 Statement <span class="id" id="mId"></span></h3>
    <div class="sqm-tabs" role="tablist" aria-label="Query 상세 탭">
      <button type="button" role="tab" class="sqm-tab" id="tabSql" aria-selected="true">쿼리문</button>
      <button type="button" role="tab" class="sqm-tab" id="tabPlan" aria-selected="false">실행 계획</button>
    </div>

    <div role="tabpanel" id="paneSql">
      <div class="sqm-cmd__head">
        <span class="sqm-dim" id="mMeta"></span>
        <button type="button" class="sqm-btn" id="copyBtn">복사</button>
      </div>
      <pre class="sqm-plan" id="mSql"></pre>
    </div>

    <div role="tabpanel" id="panePlan" style="display:none">
      <div class="sqm-plansteps">
        <table>
          <thead><tr><th>#</th><th>연산자</th><th>상세</th><th class="num">소요시간</th><th>상태</th></tr></thead>
          <tbody id="mPlanBody"></tbody>
        </table>
        <p class="sqm-plansteps__note">종료된 쿼리 — 전 단계 완료. 소요시간 50s 이상 노랑 · 100s 이상 빨강(병목 단계).</p>
      </div>
    </div>

    <div class="sqm-modal__actions">
      <button type="button" class="sqm-btn" id="closeBtn">닫기</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* 종료 SQream DB 쿼리 — 단독 HTML 목업 (running 목업의 종료 버전).
   차이: Lock Type 열 없음(15열) · 상태 전부 "완료" · 진행율 100% · 자원 열은 Peak 값 ·
   실행 계획은 전 단계 완료(소요시간 = 실제 elapsed를 단계 예산 비율로 분배) · 라이트 모드 토글. */

const MEM_LIMIT_GB = 364, GPU_MEM_GB = 70;

/* ── 15열 정의 — running 목업에서 Lock Type 제거, 자원 열 Peak 접두 (합계 1504px) ── */
const COLUMNS = [
 {key:"start",  label:"Query Start",            width:130, type:"stamp"},
 {key:"node",   label:"Hostname",               width:102, type:"text"},
 {key:"worker", label:"Worker",                 width:68,  type:"text"},
 {key:"conn",   label:"Connection ID",          width:88,  type:"mono"},
 {key:"stmt",   label:"Statement ID",           width:82,  type:"link"},
 {key:"svc",    label:"Service",                width:90,  type:"svc"},
 {key:"user",   label:"User Name",              width:70,  type:"text"},
 {key:"status", label:"상태",                   width:78,  type:"status"},
 {key:"elapsed",label:"Elapsed Time(초)",       width:104, type:"elapsed", num:true},
 {key:"prog",   label:"진행율(%)",              width:86,  type:"gauge",   num:true},
 {key:"mem",    label:"Peak 사용 메모리(GRAM)", width:178, type:"pairMem", num:true},
 {key:"spool",  label:"Disk Spool",             width:70,  type:"spool",   num:true},
 {key:"vram",   label:"Peak GPU 메모리(VRAM)",  width:158, type:"pairVram",num:true},
 {key:"gpu",    label:"Peak GPU 사용률(%)",     width:100, type:"gauge2",  num:true},
 {key:"cpu",    label:"Peak CPU 사용률(%)",     width:100, type:"gauge3",  num:true},
];

/* ── 종료 쿼리 12건 — running 목업과 같은 문장들이 전부 완료된 시점.
   자원 값은 실행 중 관측된 Peak. 짧게 끝난 문장(144219·144222·144230)은 자원 관측 없음('-'). */
const NOW = new Date("2026-08-31T14:20:00");
function R(stmt, conn, node, worker, svc, user, qid, endAgoSec, elapsed, memGb, spoolGb, vramGb, gpu, cpu){
  const end = new Date(NOW - endAgoSec*1000);
  return {stmt:String(stmt), conn:String(conn), node, worker, svc, user, qid,
    start:new Date(end - elapsed*1000), elapsed, memGb, spoolGb, vramGb, gpu, cpu};
}
const N = Number.NaN;
const rows = [
 R(144188, 402113, "icspreamh2gpu01", "sqream101", "select_service", "reporter", "SEL-04H",  30,  137,  21.6, N,    11, 91, 42),
 R(144191, 402127, "icspreamh2gpu01", "sqream102", "etl_service",    "etl_svc",  "INS-02L",  95, 3722, 291.4, N,    58, 88, 47),
 R(144205, 418704, "icspreamh2gpu02", "sqream211", "select_service", "analyst",  "JOI-07C", 120, 2185, 187.3, 13.9, 45, 76, 38),
 R(144219, 418711, "icspreamh2gpu02", "sqream212", "compile",        "mon_user", "SEL-11A",  18,    4,     N, N,     N,  N,  N),
 R(144222, 402138, "icspreamh2gpu01", "sqream101", "select_service", "risk_bot", "SCA-03F",  22,    7,     N, N,     N,  N,  N),
 R(144230, 431002, "icspreamh2gpu03", "sqream301", "etl_service",    "etl_svc",  "LOA-05B",  27,   12,     N, N,     N,  N,  N),
 R(144241, 431017, "icspreamh2gpu03", "sqream302", "sqream",         "mon_user", "AGG-09D",  40,   58,  12.2, N,     6, 45, 18),
 R(144256, 402144, "icspreamh2gpu01", "sqream102", "etl_service",    "etl_svc",  "DEL-05M",  55,  412,  98.7, N,    22, 63, 29),
 R(144263, 418720, "icspreamh2gpu02", "sqream211", "etl_service",    "etl_svc",  "LOA-08K", 200, 2410, 240.8, N,    51, 82, 51),
 R(144270, 431020, "icspreamh2gpu03", "sqream301", "select_service", "risk_bot", "SCA-06J",  75,  845, 122.2, N,    32, 87, 18),
 R(144277, 402150, "icspreamh2gpu01", "sqream101", "select_service", "reporter", "UPD-02Q",  11,  221,  53.2, N,    12, 40, 49),
 R(144281, 418729, "icspreamh2gpu02", "sqream212", "select_service", "analyst",  "SOR-01T",   6,   93,  44.1, N,     9, 38, 21),
];

/* ── 표기 헬퍼 ── */
const p2 = n => String(n).padStart(2, "0");
function stamp(d){ return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; }
function elapsedKo(sec){
  if (!Number.isFinite(sec)) return "-";
  const s = Math.floor(sec), h = Math.floor(s/3600), m = Math.floor(s%3600/60), r = s%60;
  const parts = [];
  if (h) parts.push(`${h}시간`);
  if (h || m) parts.push(`${m}분`);
  parts.push(`${r}초`);
  return parts.join(" ");
}
const esc = v => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

function gauge(pct){
  if (!Number.isFinite(pct)) return `<span class="gauge-cell" aria-label="결측"><span class="gauge-cell__text">-</span></span>`;
  const w = Math.max(0, Math.min(100, pct));
  return `<span class="gauge-cell"><span class="gauge-cell__bar" style="width:${w}%"></span><span class="gauge-cell__text">${Math.round(pct)}%</span></span>`;
}
function pair(gb, limit){
  if (!Number.isFinite(gb)) return `<span class="gauge-pair">${gauge(N)}<span class="gauge-pair__text">-</span></span>`;
  const pct = gb/limit*100;
  const txt = `${gb >= 100 ? Math.round(gb) : gb.toFixed(1)} GB / ${limit} GB`;
  return `<span class="gauge-pair">${gauge(pct)}<span class="gauge-pair__text">${txt}</span></span>`;
}
function cellHtml(r, c){
  switch (c.type) {
    case "stamp":   return esc(stamp(r.start));
    case "text":    return esc(c.key === "node" ? r.node : c.key === "worker" ? r.worker : r.user);
    case "mono":    return `<span class="mono">${esc(r.conn)}</span>`;
    case "link":    return `<button type="button" class="query-linkbtn">${esc(r.stmt)}</button>`;
    case "svc":     return r.svc === "etl_service" ? `<span class="svc-badge">etl_service</span>`
                         : r.svc === "compile" ? `<span class="svc-dim">compile</span>` : esc(r.svc || "-");
    case "status":  return `<span class="state-badge state--done">완료</span>`;
    case "elapsed": return esc(elapsedKo(r.elapsed));
    case "gauge":   return gauge(100); // 종료 — 진행율 100%
    case "gauge2":  return gauge(r.gpu);
    case "gauge3":  return gauge(r.cpu);
    case "pairMem": return pair(r.memGb, MEM_LIMIT_GB);
    case "pairVram":return pair(r.vramGb, GPU_MEM_GB);
    case "spool":   return Number.isFinite(r.spoolGb) && r.spoolGb > 0 ? `${r.spoolGb.toFixed(1)} GB` : "-";
  }
  return "-";
}

/* 정렬 값 추출 — 결측 null(항상 뒤) */
function pick(r, key){
  const num = v => Number.isFinite(v) ? v : null;
  switch (key) {
    case "start": return r.start.getTime();
    case "node": return r.node || null;    case "worker": return r.worker || null;
    case "conn": return Number(r.conn);    case "stmt": return Number(r.stmt);
    case "svc": return r.svc || null;      case "user": return r.user || null;
    case "status": return 1;               case "elapsed": return num(r.elapsed);
    case "prog": return 100;               case "mem": return num(r.memGb);
    case "spool": return Number.isFinite(r.spoolGb) && r.spoolGb > 0 ? r.spoolGb : null;
    case "vram": return num(r.vramGb);     case "gpu": return num(r.gpu); case "cpu": return num(r.cpu);
  }
  return null;
}

let sort = null; // {key, dir} — 새 열 desc 우선, 재클릭 토글
function sortedRows(){
  if (!sort) return rows;
  const {key, dir} = sort;
  return [...rows].sort((a, b) => {
    const av = pick(a, key), bv = pick(b, key);
    if (av === null && bv === null) return 0;
    if (av === null) return 1;
    if (bv === null) return -1;
    const cmp = typeof av === "number" && typeof bv === "number" ? av - bv : String(av).localeCompare(String(bv), "ko");
    return dir === "desc" ? -cmp : cmp;
  });
}

function render(){
  document.getElementById("cols").innerHTML = COLUMNS.map(c => `<col style="width:${c.width}px">`).join("");
  document.getElementById("headRow").innerHTML = COLUMNS.map(c => {
    const g = sort && sort.key === c.key ? (sort.dir === "desc" ? " ▼" : " ▲") : "";
    return `<th data-key="${c.key}" class="${g ? "is-sorted" : ""}">${esc(c.label)}${g}</th>`;
  }).join("");
  const body = document.getElementById("tbody");
  body.innerHTML = sortedRows().map(r => {
    const tint = Number.isFinite(r.spoolGb) && r.spoolGb > 0 ? "row--spool" : r.elapsed >= 1800 ? "row--long" : "";
    return `<tr class="${tint}" data-stmt="${r.stmt}">` + COLUMNS.map(c =>
      `<td class="${c.num ? "num" : ""}">${cellHtml(r, c)}</td>`).join("") + "</tr>";
  }).join("");
  document.getElementById("rowCount").textContent = rows.length;
}

/* ── 쿼리문/실행 계획 목업 — running 목업과 같은 어휘 ── */
const SQL_BY_CODE = {
  SEL: "SELECT region, SUM(amount) AS total\n  FROM sales.public.orders\n GROUP BY region\n ORDER BY total DESC;",
  AGG: "SELECT product_id, COUNT(*) AS cnt, SUM(qty) AS qty\n  FROM sales.public.order_items\n GROUP BY product_id;",
  JOI: "SELECT c.customer_name, o.order_date, o.amount\n  FROM sales.public.orders o\n  JOIN sales.public.customers c ON c.customer_key = o.customer_key\n  JOIN sales.public.regions  r ON r.region_name  = c.region_name\n  JOIN sales.public.channels ch ON ch.channel_name = o.channel_name;",
  SOR: "SELECT *\n  FROM sales.public.orders\n ORDER BY order_date DESC, customer_name;",
  SCA: "SELECT *\n  FROM risk.public.transactions\n WHERE txn_id IN (SELECT txn_id FROM risk.public.flagged);",
  INS: "INSERT INTO sales.public.orders_daily\nSELECT * FROM staging.public.orders_raw;",
  LOA: "CREATE TABLE etl.public.fact_daily AS\nSELECT o.*, c.region_name\n  FROM staging.public.orders_raw o\n  JOIN sales.public.customers c ON c.customer_key = o.customer_key;",
  DEL: "DELETE FROM sales.public.orders\n WHERE order_date < DATEADD(day, -400, CURRENT_DATE);",
  UPD: "UPDATE sales.public.customers\n   SET grade = 'A'\n WHERE lifetime_amount > 1000000;",
  DEFAULT: "SELECT 1;",
};
function mockSql(r){
  const body = SQL_BY_CODE[r.qid.slice(0,3)] ?? SQL_BY_CODE.DEFAULT;
  return `-- statement ${r.stmt} · ${r.qid} · user=${r.user} · worker=${r.worker}\n\n${body}`;
}

function planSkeleton(code){
  switch (code) {
    case "JOI": return [
      ["PushToNetworkQueue","rows=all",false],["GpuJoin","on=channel_name",true],
      ["GpuJoin","on=region_name",true],["GpuJoin","on=customer_key",true],
      ["GpuDecompress","",true],["ReadTable","table=sales.public.orders",false],
      ["ReadTable","table=sales.public.customers",false]];
    case "SEL": case "SOR": return [
      ["PushToNetworkQueue","rows=all",false],["Reorder","sort=total DESC",false],
      ["GpuReduce","group_by=region",true],["GpuTransform","expr=sum(amount)",true],
      ["GpuDecompress","",true],["ReadTable","table=sales.public.orders",false]];
    case "AGG": return [
      ["PushToNetworkQueue","rows=all",false],["Reorder","sort=cnt DESC",false],
      ["GpuReduce","group_by=product_id",true],["GpuTransform","expr=sum(qty)",true],
      ["GpuDecompress","",true],["ReadTable","table=sales.public.order_items",false]];
    case "DEL": return [
      ["DeleteRows","table=sales.public.orders",false],
      ["Filter","pred=order_date < dateadd(day,-400,current_date)",false],
      ["GpuDecompress","",true],["ReadTable","table=sales.public.orders",false]];
    case "UPD": return [
      ["UpdateRows","table=sales.public.customers",false],
      ["Filter","pred=lifetime_amount > 1000000",false],
      ["GpuDecompress","",true],["ReadTable","table=sales.public.customers",false]];
    case "INS": case "LOA": return [
      ["WriteTable", code === "INS" ? "table=sales.public.orders_daily" : "table=etl.public.fact_daily", false],
      ["Rechunk","target=64MB",false],["GpuCompress","",true],
      ["ReadTable","table=staging.public.orders_raw",false]];
    default: return [
      ["PushToNetworkQueue","rows=all",false],["Reorder","sort=timestamp DESC",false],
      ["GpuReduce","group_by=region",true],["Filter","pred=event_date >= dateadd(day,-30,getdate())",false],
      ["GpuDecompress","",true],["ReadTable","table=public.sales_data",false]];
  }
}
function hashOf(seed){ let h = 0; for (const ch of seed) h = (h*131 + ch.codePointAt(0)) % 10007; return h; }
const unit = (seed, salt) => hashOf(`${seed}/${salt}`) / 10006;

/* 종료 쿼리 플랜 — 전 단계 완료. 총 소요 = 실제 elapsed를 단계 가중치(병목 45~70%)로 분배. */
function mockPlanSteps(r){
  const skel = planSkeleton(r.qid.slice(0,3));
  const seed = r.stmt + r.qid;
  const bn = hashOf(`${seed}/bn`) % skel.length;
  const w = skel.map((_, i) => 0.5 + unit(seed, 20 + i));
  const others = w.reduce((a, x, i) => i === bn ? a : a + x, 0);
  w[bn] = others * (0.82 + 1.5 * unit(seed, 40));
  const wsum = w.reduce((a, b) => a + b, 0);
  const elapsed = Number.isFinite(r.elapsed) ? Math.max(0, r.elapsed) : 0;
  return skel.map((s, i) => ({step:i+1, op:s[0], detail:s[1], gpu:s[2],
    seconds: w[i] / wsum * elapsed, state:"done"}));
}
function timeClass(s){ return s >= 100 ? "sqm-plansteps__time--red" : s >= 50 ? "sqm-plansteps__time--yellow" : ""; }

/* ── 모달 ── */
let current = null;
function openDetail(r, tab){
  current = r;
  document.getElementById("mId").textContent = r.stmt;
  document.getElementById("mMeta").textContent = `${r.qid} · ${r.user} · ${r.worker} · 완료`;
  document.getElementById("mSql").textContent = mockSql(r);
  document.getElementById("mPlanBody").innerHTML = mockPlanSteps(r).map(s =>
    `<tr><td>${s.step}</td>`
    + `<td>${esc(s.op)}${s.gpu ? ' <span class="sqm-plansteps__gpu">[GPU]</span>' : ""}</td>`
    + `<td class="sqm-dim">${esc(s.detail)}</td>`
    + `<td class="num ${timeClass(s.seconds)}">${s.seconds.toFixed(1)}s</td>`
    + `<td><span class="sqm-pill sqm-pill--green">완료</span></td></tr>`).join("");
  setTab(tab || "sql");
  document.getElementById("modalBg").classList.add("show");
}
function setTab(t){
  document.getElementById("tabSql").setAttribute("aria-selected", String(t === "sql"));
  document.getElementById("tabPlan").setAttribute("aria-selected", String(t === "plan"));
  document.getElementById("paneSql").style.display = t === "sql" ? "" : "none";
  document.getElementById("panePlan").style.display = t === "plan" ? "" : "none";
}
function closeDetail(){ document.getElementById("modalBg").classList.remove("show"); current = null; }

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.style.display = "none"; }, 2200);
}

/* ── 라이트/다크 모드 토글 — localStorage에 기억(실패해도 동작) ── */
const THEME_KEY = "sqream-end-queries-theme";
function applyTheme(light){
  document.body.classList.toggle("light", light);
  document.getElementById("themeBtn").textContent = light ? "다크 모드" : "라이트 모드";
}
let lightMode = false;
try { lightMode = localStorage.getItem(THEME_KEY) === "light"; } catch (e) { /* 프라이빗 모드 등 */ }
applyTheme(lightMode);
document.getElementById("themeBtn").addEventListener("click", () => {
  lightMode = !lightMode;
  applyTheme(lightMode);
  try { localStorage.setItem(THEME_KEY, lightMode ? "light" : "dark"); } catch (e) { /* 무시 */ }
});

/* ── 이벤트 ── */
document.getElementById("headRow").addEventListener("click", e => {
  const th = e.target.closest("th"); if (!th) return;
  const key = th.dataset.key;
  sort = sort && sort.key === key ? {key, dir: sort.dir === "desc" ? "asc" : "desc"} : {key, dir:"desc"};
  render();
});
document.getElementById("tbody").addEventListener("click", e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  const r = rows.find(x => x.stmt === tr.dataset.stmt); if (!r) return;
  openDetail(r, e.target.closest(".query-linkbtn") ? "plan" : "sql");
});
document.getElementById("tabSql").addEventListener("click", () => setTab("sql"));
document.getElementById("tabPlan").addEventListener("click", () => setTab("plan"));
document.getElementById("closeBtn").addEventListener("click", closeDetail);
document.getElementById("modalBg").addEventListener("click", e => { if (e.target.id === "modalBg") closeDetail(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });
document.getElementById("copyBtn").addEventListener("click", () => {
  if (!current) return;
  const done = ok => toast(ok ? "📋 쿼리문을 클립보드에 복사했습니다." : "⚠ 복사 실패 — 문장을 직접 선택해 복사하세요.");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(mockSql(current)).then(() => done(true), () => done(false));
  } else { done(false); }
});

/* 상태 띠 시계·스냅샷 */
document.getElementById("snapAt").textContent = stamp(NOW);
function tick(){ document.getElementById("clock").textContent = stamp(new Date()).slice(11); }
tick(); setInterval(tick, 1000);

render();
</script>
