<div class="container"><div class="content trace"><h2>AI Metrics GPU Process 조회</h2>
<div class="trace_search gpu-search"><div class="top"><div class="search-group period"><p class="tit">조회기간</p><div class="input_box"><input class="m_input datepicker date time" id="rangeStart"><span>-</span><input class="m_input datepicker date time" id="rangeEnd"></div></div><div class="search-group field"><p class="tit">GPU UUID</p><input class="m_input" id="search1" onkeydown="if(event.keyCode===13)searchGpuMetrics();"></div><div class="search-group field"><p class="tit">PID</p><input class="m_input" id="search2" onkeydown="if(event.keyCode===13)searchGpuMetrics();"></div><div class="btn_area"><button type="button" class="btn_red" style="border-radius:7px;width:62px" onclick="searchGpuMetrics();">검색</button></div></div></div>
<div class="width1 grid_wrap textleft gpu-grid-shell"><table id="gpuMetricsGrid"></table><div id="gpuMetricsPager"></div></div></div></div>
<div id="gpuDetailModal" class="m_modal gpu-detail"><div class="m_modal_container"><div class="m_modal_header"><h2 class="tit">GPU Process 상세조회</h2><p class="m_modal_close" onclick="closeDetail();"></p></div><div class="m_modal_body"><div id="gpuDetailSummary" style="margin-bottom:14px"></div><div id="gpuDetailList"></div><div class="modal_btn_area"><button class="modal_btn_gray" onclick="closeDetail();" type="button">닫기</button></div></div></div></div>
<script>
"use strict";
// 20260916 추가: ax_metrics_gpu_process 조회 페이지
var gpuVars={baseUrl:"/api/aimetricsboard/gpu/process",grid:$("#gpuMetricsGrid")};
$(function(){initDate();initGrid();searchGpuMetrics();$(window).on("resize",resizeGrid);});
function initDate(){if(!$("#rangeStart").length)return;var e=new Date(),s=new Date();s.setHours(s.getHours()-1);util.datetimePicker($("#rangeStart"),s);util.datetimePicker($("#rangeEnd"),e);}
function initGrid(){util.jqGrid(gpuVars.grid,{datatype:"local",rownumbers:true,rownumWidth:32,shrinkToFit:true,autowidth:true,colNames:["GPU UUID", "NVIDIA SMI ID", "PID", "GPU ID", "GI ID", "CI ID", "MIG UUID", "PROCESS TYPE", "PROCESS NAME", "MEMORY USED(GB)", "GPU MEMORY USED(GB)", "GPU UTILIZATION PERCENT", "USER NAME", "CPU USAGE PERCENT", "MEMORY USAGE PERCENT", "PHYSICAL MEMORY(GB)", "VIRTUAL MEMORY(GB)", "STATUS", "ELAPSED TIME(초)", "DIFF TIME(초)", "START TIME STR", "COMMAND", "PHYSICAL MEMORY(GB)", "VIRTUAL MEMORY(GB)", "START TIME"],colModel:[{name:"gpuUuid",width:210,align:"center",formatter:function(v){if(!v)return "";return '<a class="gpu-key-link" onclick="viewDetail(\''+escapeJs(v)+'\')">'+$.jgrid.htmlEncode(v)+'</a>';}},{name:"nvidiaSmiId",width:125,align:"center",formatter:formatGpuId},{name:"pid",width:125,align:"center",formatter:formatGpuId},{name:"gpuId",width:125,align:"center",formatter:formatGpuId},{name:"giId",width:125,align:"center",formatter:formatGpuId},{name:"ciId",width:125,align:"center",formatter:formatGpuId},{name:"migUuid",width:210,align:"center",formatter:formatGpuId},{name:"processType",width:125,align:"center"},{name:"processName",width:180,align:"center"},{name:"memoryUsedMib",width:125,align:"center",formatter:formatGpuGbFromMib},{name:"gpuMemoryUsedMib",width:125,align:"center",formatter:formatGpuGbFromMib},{name:"gpuUtilizationPercent",width:125,align:"center"},{name:"userName",width:125,align:"center"},{name:"cpuUsagePercent",width:125,align:"center"},{name:"memoryUsagePercent",width:125,align:"center"},{name:"physicalMemoryKib",width:125,align:"center",formatter:formatGpuGbFromKib},{name:"virtualMemoryKib",width:125,align:"center",formatter:formatGpuGbFromKib},{name:"status",width:125,align:"center"},{name:"elapsedTime",width:125,align:"center",formatter:formatGpuSeconds},{name:"diffTime",width:125,align:"center",formatter:formatGpuSeconds},{name:"startTimeStr",width:125,align:"center"},{name:"command",width:180,align:"center"},{name:"physicalMemoryMib",width:125,align:"center",formatter:formatGpuGbFromMib},{name:"virtualMemoryMib",width:125,align:"center",formatter:formatGpuGbFromMib},{name:"startTime",width:125,align:"center",formatter:formatGpuDateTime}],rowNum:20,rowList:[20,50,100,200],pager:"#gpuMetricsPager"});}
function searchGpuMetrics(){var u=gpuVars.baseUrl+"?size=200";if($("#rangeStart").length){var s=normalizeDate($("#rangeStart").val()),e=normalizeDate($("#rangeEnd").val());if(s)u+="&startTime="+encodeURIComponent(s);if(e)u+="&endTime="+encodeURIComponent(e);}var a=$.trim($("#search1").val()),b=$.trim($("#search2").val());if(a)u+="&search1="+encodeURIComponent(a);if(b)u+="&search2="+encodeURIComponent(b);$.get(u,function(d){gpuVars.grid.clearGridData().setGridParam({data:d.content||[],datatype:"local"}).trigger("reloadGrid");resizeGrid();}).fail(function(){alert("GPU Metrics 조회에 실패했습니다.");});}
function resizeGrid(){var w=$(".gpu-grid-shell").width();if(w&&gpuVars.grid[0]&&gpuVars.grid[0].grid)gpuVars.grid.jqGrid("setGridWidth",w,false);}
function viewDetail(k){$.get(gpuVars.baseUrl+"/detail?key="+encodeURIComponent(k),function(rows){$("#gpuDetailSummary").text("GPU UUID: "+k);renderDetail(rows||[]);$("#gpuDetailModal").addClass("on");$("body").css("overflow","hidden");}).fail(function(){alert("상세 조회에 실패했습니다.");});}
function renderDetail(rows){var $x=$("#gpuDetailList").empty();if(!rows.length){$x.html('<div style="text-align:center;padding:35px">조회된 상세 데이터가 없습니다.</div>');return;}var r=rows[0],h='<table class="gpu-detail-table"><tbody>';// 20260916 추가: Thymeleaf가 JavaScript의 [[...]]를 인라인 표현식으로 해석하지 않도록 객체 배열로 변경
var fields=[{field:"nvidiaSmiId",label:"NVIDIA SMI ID"}, {field:"pid",label:"PID"}, {field:"gpuId",label:"GPU ID"}, {field:"giId",label:"GI ID"}, {field:"ciId",label:"CI ID"}, {field:"gpuUuid",label:"GPU UUID"}, {field:"migUuid",label:"MIG UUID"}, {field:"processType",label:"PROCESS TYPE"}, {field:"processName",label:"PROCESS NAME"}, {field:"memoryUsedMib",label:"MEMORY USED(GB)"}, {field:"gpuMemoryUsedMib",label:"GPU MEMORY USED(GB)"}, {field:"gpuUtilizationPercent",label:"GPU UTILIZATION PERCENT"}, {field:"userName",label:"USER NAME"}, {field:"cpuUsagePercent",label:"CPU USAGE PERCENT"}, {field:"memoryUsagePercent",label:"MEMORY USAGE PERCENT"}, {field:"physicalMemoryKib",label:"PHYSICAL MEMORY(GB)"}, {field:"virtualMemoryKib",label:"VIRTUAL MEMORY(GB)"}, {field:"status",label:"STATUS"}, {field:"elapsedTime",label:"ELAPSED TIME(초)"}, {field:"diffTime",label:"DIFF TIME(초)"}, {field:"startTimeStr",label:"START TIME STR"}, {field:"command",label:"COMMAND"}, {field:"physicalMemoryMib",label:"PHYSICAL MEMORY(GB)"}, {field:"virtualMemoryMib",label:"VIRTUAL MEMORY(GB)"}, {field:"createDt",label:"CREATE DT"}, {field:"updateDt",label:"UPDATE DT"}, {field:"startTime",label:"START TIME"}];for(var i=0;i<fields.length;i++){var field=fields[i].field,v=formatGpuDetailValue(field,r[field]);h+='<tr><th>'+$.jgrid.htmlEncode(fields[i].label)+'</th><td>'+$.jgrid.htmlEncode(gpuEmpty(v)?' - ':String(v))+'</td></tr>';}h+='</tbody></table>';$x.html(h);}
// ===== 20260929 추가 시작 : MetricsNode 동일 표시 규칙(GB/단위/콤마/시간) =====
function gpuEmpty(v){return v===null||v===undefined||v==="";}
function formatGpuInteger(v){if(gpuEmpty(v))return "";var n=Number(v);if(!isFinite(n))return v;return Math.trunc(n).toLocaleString("en-US");}
function formatGpuId(v){return gpuEmpty(v)?"":String(v);}
function formatGpuGbFromMib(v){if(gpuEmpty(v))return "";var n=Number(v);if(!isFinite(n))return v;return (n/1024).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1})+" GB";}
function formatGpuGbFromKib(v){if(gpuEmpty(v))return "";var n=Number(v);if(!isFinite(n))return v;return (n/1024/1024).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1})+" GB";}
function formatGpuGbFromBytes(v){if(gpuEmpty(v))return "";var n=Number(v);if(!isFinite(n))return v;return (n/1024/1024/1024).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1})+" GB";}
function formatGpuTemp(v){if(gpuEmpty(v))return "";var n=Number(v);return isFinite(n)?n.toLocaleString("en-US",{maximumFractionDigits:1})+" ℃":v;}
function formatGpuPower(v){if(gpuEmpty(v))return "";var n=Number(v);return isFinite(n)?n.toLocaleString("en-US",{maximumFractionDigits:1})+" W":v;}
function formatGpuSeconds(v){if(gpuEmpty(v))return "";var n=Number(v);return isFinite(n)?Math.trunc(n).toLocaleString("en-US")+" 초":v;}
function formatGpuDateTime(v){if(gpuEmpty(v))return "";return String(v).replace("T"," ").replace(/(\.\d+)(?=$|Z|[+-]\d\d:?\d\d$)/,"").replace(/Z$/,"");}
function formatGpuNumber(v){if(gpuEmpty(v))return "";var n=Number(v);return isFinite(n)?n.toLocaleString("en-US",{maximumFractionDigits:2}):v;}
function formatGpuDetailValue(field,v){
    if(gpuEmpty(v))return "";
    if(["nvidiaSmiId","gpuId","giId","ciId","pid","migIndex","serverId","uuid","globalUuid","gpuUuid","migUuid","instanceId"].indexOf(field)>=0)return formatGpuId(v);
    if(["snapshotTime","collectTime","createDt","updateDt","startTime"].indexOf(field)>=0)return formatGpuDateTime(v);
    if(field==="temperatureC")return formatGpuTemp(v);
    if(field==="powerUsageW"||field==="powerCapW")return formatGpuPower(v);
    if(["memoryUsedMib","memoryTotalMib","bar1UsedMib","bar1TotalMib","gpuMemoryUsedMib","gpuMemoryTotalMib","physicalMemoryMib","virtualMemoryMib"].indexOf(field)>=0)return formatGpuGbFromMib(v);
    if(field==="physicalMemoryKib"||field==="virtualMemoryKib")return formatGpuGbFromKib(v);
    if(["pcieBytesTransmitted","pcieBytesReceived","nvlinkBytesTransmitted","nvlinkBytesReceived"].indexOf(field)>=0)return formatGpuGbFromBytes(v);
    if(field==="elapsedTime"||field==="diffTime")return formatGpuSeconds(v);
    if(typeof v==="number")return formatGpuNumber(v);
    return v;
}
// ===== 20260929 추가 끝 =====
function closeDetail(){$("#gpuDetailModal").removeClass("on");$("body").css("overflow","auto");}
function escapeJs(v){return String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'");} // 20260929 추가 : Grid 초기화 중단 JS 오류 수정
function normalizeDate(v){if(!v)return "";return String(v).replace("T"," ");}
</script>
